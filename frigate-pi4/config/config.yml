# Frigate config — Pi 4 4GB + กล้อง Seetong (192.168.1.21)
# ทดลองขนานกับ NUUO — ไม่แตะระบบเดิม (read-only ต่อกล้อง)
# ตรวจรันจริง: http://192.168.1.33:5000

mqtt: enabled: false

# hw decode บน VideoCore — ขาดตัวนี้ CPU ล้นทันทีบน Pi 4
ffmpeg:
  hwaccel_args: preset-rpi-64-h264

# ทดลอง: ใช้ CPU detector ก่อน (1 กล้อง fps 5 พอไหว)
# ถ้ามี Coral USB แล้ว เปิดส่วน detectors ด้านล่าง + ลบข้อความนี้
# detectors:
#   coral:
#     type: edgetpu
#     device: usb

go2rtc:
  streams:
    seetong_main:
      - rtsp://admin:123456@192.168.1.21:554/0   # 1080p
    seetong_sub:
      - rtsp://admin:123456@192.168.1.21:554/1   # 360p (detect เบา)

cameras:
  seetong_front:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/seetong_sub
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/seetong_main
          input_args: preset-rtsp-restream
          roles: [record]
    detect:
      enabled: true
      fps: 5
    objects:
      track: [person]
    record:
      enabled: true
      retain:
        days: 7          # SSD 120GB — motion-only เก็บได้ราว 7-10 วัน
        mode: motion
    snapshots:
      enabled: true
      retain:
        default: 7

# แจ้ง Telegram ผ่าน webhook (ตั้งครั้งหลังระบบนิ่ง — ดู plans/2026-09-20_Frigate-Trial-Plan.md §7)
